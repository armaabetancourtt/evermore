name: Compiler hardening
on:
  push:
    paths: ['src/tooling/**','tests/compiler-fuzz-smoke.test.ts','tests/agent-security.test.ts','tests/package-integrity.test.ts','.github/workflows/hardening.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm test
