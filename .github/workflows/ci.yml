name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: evermore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Reproduce M1 syntax study
        run: npm run research:m1

      - name: Reproduce M2 type-system study
        run: npm run research:m2

      - name: Build compiler
        run: npm run build

      - name: Check explicit example
        run: npm run evermore -- check examples/hello.ever

      - name: Check natural example
        run: npm run evermore -- check examples/natural.ever

      - name: Check reactive example
        run: npm run evermore -- check examples/counter.ever

      - name: Check layout example
        run: npm run evermore -- check examples/layout.ever

      - name: Check component example
        run: npm run evermore -- check examples/components.ever

      - name: Check M1 showcase
        run: npm run evermore -- check examples/showcase.ever

      - name: Check typed data example
        run: npm run evermore -- check examples/data.ever

      - name: Check typed function example
        run: npm run evermore -- check examples/functions.ever

      - name: Check choice example
        run: npm run evermore -- check examples/choices.ever

      - name: Check match example
        run: npm run evermore -- check examples/match.ever

      - name: Check inference example
        run: npm run evermore -- check examples/inference.ever

      - name: Check generics example
        run: npm run evermore -- check examples/generics.ever

      - name: Check protocol example
        run: npm run evermore -- check examples/protocols.ever

      - name: Check protocol values example
        run: npm run evermore -- check examples/protocol-values.ever

      - name: Check data constructor example
        run: npm run evermore -- check examples/constructors.ever

      - name: Check mutable values example
        run: npm run evermore -- check examples/mutable-values.ever

      - name: Check typed collections example
        run: npm run evermore -- check examples/collections.ever

      - name: Check protocol methods example
        run: npm run evermore -- check examples/protocol-methods.ever

      - name: Check classes example
        run: npm run evermore -- check examples/classes.ever

      - name: Check typed result example
        run: npm run evermore -- check examples/result.ever

      - name: Check multi-file modules example
        run: npm run evermore -- check examples/modules/main.ever

      - name: Check local package graph
        run: npm run evermore -- check examples/packages/app/evermore.json

      - name: Check full-stack example
        run: npm run evermore -- check examples/full-stack.ever

      - name: Check AI-native example
        run: npm run evermore -- check examples/ai-native.ever

      - name: Check mobile example
        run: npm run evermore -- check examples/mobile.ever

      - name: Check data science example
        run: npm run evermore -- check examples/data-science.ever

      - name: Verify canonical formatter
        run: |
          npm run --silent evermore -- format examples/natural.ever > /tmp/natural.formatted.ever
          cmp examples/natural.ever /tmp/natural.formatted.ever

      - name: Generate Vue application
        run: npm run evermore -- build examples/natural.ever --out /tmp/evermore-example

      - name: Verify generated manifest
        run: test -f /tmp/evermore-example/src/generated/evermore.manifest.json

      - name: Install generated application
        working-directory: /tmp/evermore-example
        run: npm install

      - name: Build generated Vue application
        working-directory: /tmp/evermore-example
        run: npm run build

      - name: Generate reactive Vue application
        run: npm run evermore -- build examples/counter.ever --out /tmp/evermore-counter

      - name: Install reactive application
        working-directory: /tmp/evermore-counter
        run: npm install

      - name: Build reactive Vue application
        working-directory: /tmp/evermore-counter
        run: npm run build

      - name: Generate layout Vue application
        run: npm run evermore -- build examples/layout.ever --out /tmp/evermore-layout

      - name: Install layout application
        working-directory: /tmp/evermore-layout
        run: npm install

      - name: Build layout Vue application
        working-directory: /tmp/evermore-layout
        run: npm run build

      - name: Generate M1 showcase
        run: npm run evermore -- build examples/showcase.ever --out /tmp/evermore-showcase

      - name: Install M1 showcase
        working-directory: /tmp/evermore-showcase
        run: npm install

      - name: Build M1 showcase
        working-directory: /tmp/evermore-showcase
        run: npm run build

      - name: Generate typed data application
        run: npm run evermore -- build examples/data.ever --out /tmp/evermore-data

      - name: Install typed data application
        working-directory: /tmp/evermore-data
        run: npm install

      - name: Build typed data application
        working-directory: /tmp/evermore-data
        run: npm run build

      - name: Verify generated type model
        run: test -f /tmp/evermore-data/src/generated/models.ts

      - name: Generate typed function application
        run: npm run evermore -- build examples/functions.ever --out /tmp/evermore-functions

      - name: Install typed function application
        working-directory: /tmp/evermore-functions
        run: npm install

      - name: Build typed function application
        working-directory: /tmp/evermore-functions
        run: npm run build

      - name: Verify generated functions
        run: test -f /tmp/evermore-functions/src/generated/functions.ts

      - name: Generate choice application
        run: npm run evermore -- build examples/choices.ever --out /tmp/evermore-choices

      - name: Install choice application
        working-directory: /tmp/evermore-choices
        run: npm install

      - name: Build choice application
        working-directory: /tmp/evermore-choices
        run: npm run build

      - name: Verify generated choice model
        run: grep -q '"Status"' /tmp/evermore-choices/src/generated/models.ts

      - name: Generate match application
        run: npm run evermore -- build examples/match.ever --out /tmp/evermore-match

      - name: Install match application
        working-directory: /tmp/evermore-match
        run: npm install

      - name: Build match application
        working-directory: /tmp/evermore-match
        run: npm run build

      - name: Verify generated exhaustive match
        run: grep -q 'Unreachable Evermore match' /tmp/evermore-match/src/generated/functions.ts

      - name: Generate inference application
        run: npm run evermore -- build examples/inference.ever --out /tmp/evermore-inference

      - name: Install inference application
        working-directory: /tmp/evermore-inference
        run: npm install

      - name: Build inference application
        working-directory: /tmp/evermore-inference
        run: npm run build

      - name: Verify bidirectional generic inference generation
        run: |
          grep -Eq 'return fn_[0-9]+\(\[\]\);' /tmp/evermore-inference/src/generated/functions.ts
          grep -Eq 'function fn_[0-9]+<T0>\(arg_0: T0\): T0' /tmp/evermore-inference/src/generated/functions.ts

      - name: Generate generics application
        run: npm run evermore -- build examples/generics.ever --out /tmp/evermore-generics

      - name: Install generics application
        working-directory: /tmp/evermore-generics
        run: npm install

      - name: Build generics application
        working-directory: /tmp/evermore-generics
        run: npm run build

      - name: Verify generated generic functions
        run: grep -q 'function fn_0<T0>' /tmp/evermore-generics/src/generated/functions.ts

      - name: Generate protocol application
        run: npm run evermore -- build examples/protocols.ever --out /tmp/evermore-protocols

      - name: Install protocol application
        working-directory: /tmp/evermore-protocols
        run: npm install

      - name: Build protocol application
        working-directory: /tmp/evermore-protocols
        run: npm run build

      - name: Verify generated protocol contracts
        run: grep -q 'EvermoreProtocols' /tmp/evermore-protocols/src/generated/models.ts

      - name: Generate protocol values application
        run: npm run evermore -- build examples/protocol-values.ever --out /tmp/evermore-protocol-values

      - name: Install protocol values application
        working-directory: /tmp/evermore-protocol-values
        run: npm install

      - name: Build protocol values application
        working-directory: /tmp/evermore-protocol-values
        run: npm run build

      - name: Verify generated protocol member access
        run: grep -q 'EvermoreProtocols\["Named"\]' /tmp/evermore-protocol-values/src/generated/functions.ts

      - name: Generate data constructor application
        run: npm run evermore -- build examples/constructors.ever --out /tmp/evermore-constructors

      - name: Install data constructor application
        working-directory: /tmp/evermore-constructors
        run: npm install

      - name: Build data constructor application
        working-directory: /tmp/evermore-constructors
        run: npm run build

      - name: Verify generated data constructor
        run: |
          grep -q '"name": "Ada"' /tmp/evermore-constructors/src/generated/functions.ts

      - name: Generate mutable values application
        run: npm run evermore -- build examples/mutable-values.ever --out /tmp/evermore-mutable

      - name: Install mutable values application
        working-directory: /tmp/evermore-mutable
        run: npm install

      - name: Build mutable values application
        working-directory: /tmp/evermore-mutable
        run: npm run build

      - name: Verify generated mutable assignment
        run: |
          grep -q 'let local_0 = arg_0;' /tmp/evermore-mutable/src/generated/functions.ts

      - name: Generate typed collections application
        run: npm run evermore -- build examples/collections.ever --out /tmp/evermore-collections

      - name: Install typed collections application
        working-directory: /tmp/evermore-collections
        run: npm install

      - name: Build typed collections application
        working-directory: /tmp/evermore-collections
        run: npm run build

      - name: Verify generated collection families
        run: |
          grep -q 'ReadonlySet<string>' /tmp/evermore-collections/src/generated/functions.ts
          grep -q 'ReadonlyMap<string, number>' /tmp/evermore-collections/src/generated/functions.ts
          grep -q 'new Set' /tmp/evermore-collections/src/generated/functions.ts
          grep -q 'new Map' /tmp/evermore-collections/src/generated/functions.ts

      - name: Generate protocol methods application
        run: npm run evermore -- build examples/protocol-methods.ever --out /tmp/evermore-protocol-methods

      - name: Install protocol methods application
        working-directory: /tmp/evermore-protocol-methods
        run: npm install

      - name: Build protocol methods application
        working-directory: /tmp/evermore-protocol-methods
        run: npm run build

      - name: Verify generated protocol methods
        run: |
          grep -q 'readonly "display": () => string;' /tmp/evermore-protocol-methods/src/generated/models.ts
          grep -q '"display": (): string => {' /tmp/evermore-protocol-methods/src/generated/functions.ts
          grep -q '\["display"\]()' /tmp/evermore-protocol-methods/src/generated/functions.ts

      - name: Generate classes application
        run: npm run evermore -- build examples/classes.ever --out /tmp/evermore-classes

      - name: Install classes application
        working-directory: /tmp/evermore-classes
        run: npm install

      - name: Build classes application
        working-directory: /tmp/evermore-classes
        run: npm run build

      - name: Verify generated encapsulation
        run: |
          grep -q '"Account": EvermoreProtocols\["Named"\]' /tmp/evermore-classes/src/generated/models.ts
          grep -q 'readonly "name": string;' /tmp/evermore-classes/src/generated/models.ts
          ! grep -q 'readonly "accessToken": string;' /tmp/evermore-classes/src/generated/models.ts
          grep -q 'const field_1 = "internal-token";' /tmp/evermore-classes/src/generated/functions.ts
          ! grep -q '"accessToken": field_1' /tmp/evermore-classes/src/generated/functions.ts

      - name: Generate typed result application
        run: npm run evermore -- build examples/result.ever --out /tmp/evermore-result

      - name: Install typed result application
        working-directory: /tmp/evermore-result
        run: npm install

      - name: Build typed result application
        working-directory: /tmp/evermore-result
        run: npm run build

      - name: Verify generated typed result flow
        run: |
          grep -q 'readonly kind: "ok"' /tmp/evermore-result/src/generated/functions.ts
          grep -q 'readonly kind: "error"' /tmp/evermore-result/src/generated/functions.ts
          grep -q 'switch (matchValue.kind)' /tmp/evermore-result/src/generated/functions.ts
          grep -q 'matchValue.value' /tmp/evermore-result/src/generated/functions.ts
          grep -q 'matchValue.error' /tmp/evermore-result/src/generated/functions.ts

      - name: Generate multi-file modules application
        run: npm run evermore -- build examples/modules/main.ever --out /tmp/evermore-modules

      - name: Install multi-file modules application
        working-directory: /tmp/evermore-modules
        run: npm install

      - name: Build multi-file modules application
        working-directory: /tmp/evermore-modules
        run: npm run build

      - name: Verify generated cross-module declarations
        run: |
          grep -q '"User": EvermoreProtocols\["Named"\]' /tmp/evermore-modules/src/generated/models.ts
          grep -q '"makeUser"' /tmp/evermore-modules/src/generated/functions.ts
          grep -q '\["display"\]()' /tmp/evermore-modules/src/generated/functions.ts

      - name: Generate local package application
        run: npm run evermore -- build examples/packages/app/evermore.json --out /tmp/evermore-package

      - name: Install local package application
        working-directory: /tmp/evermore-package
        run: npm install

      - name: Build local package application
        working-directory: /tmp/evermore-package
        run: npm run build

      - name: Verify generated package graph
        run: |
          test -f /tmp/evermore-package/src/generated/evermore.package.json
          grep -q '"name": "package-app"' /tmp/evermore-package/src/generated/evermore.package.json
          grep -q '"shared": "1.0.0"' /tmp/evermore-package/src/generated/evermore.package.json
          grep -q '"contracts": "1.0.0"' /tmp/evermore-package/src/generated/evermore.package.json
          grep -q '"makeUser"' /tmp/evermore-package/src/generated/functions.ts




      - name: Generate full-stack Vue client
        run: npm run evermore -- build examples/full-stack.ever --target vue --out /tmp/evermore-fullstack-web

      - name: Install full-stack Vue client
        working-directory: /tmp/evermore-fullstack-web
        run: npm install

      - name: Build full-stack Vue client
        working-directory: /tmp/evermore-fullstack-web
        run: npm run build

      - name: Generate full-stack Node service
        run: npm run evermore -- build examples/full-stack.ever --target node --out /tmp/evermore-fullstack-node

      - name: Install full-stack Node service
        working-directory: /tmp/evermore-fullstack-node
        run: npm install

      - name: Build full-stack Node service
        working-directory: /tmp/evermore-fullstack-node
        run: npm run build

      - name: Verify M3 server artifacts
        run: |
          test -f /tmp/evermore-fullstack-node/src/generated/contracts.ts
          test -f /tmp/evermore-fullstack-node/src/generated/validation.ts
          test -f /tmp/evermore-fullstack-node/src/generated/repositories.ts
          test -f /tmp/evermore-fullstack-node/src/generated/jobs.ts
          test -f /tmp/evermore-fullstack-node/src/generated/realtime.ts
          grep -q 'DATABASE_URL' /tmp/evermore-fullstack-node/src/generated/repositories.ts
          grep -q 'authorization' /tmp/evermore-fullstack-node/src/generated/server.ts


      - name: Generate AI-native runtime
        run: npm run evermore -- build examples/ai-native.ever --target ai --out /tmp/evermore-ai

      - name: Install generated AI runtime
        working-directory: /tmp/evermore-ai
        run: npm install

      - name: Build generated AI runtime
        working-directory: /tmp/evermore-ai
        run: npm run build

      - name: Run deterministic AI evaluations
        working-directory: /tmp/evermore-ai
        run: npm test

      - name: Verify M4 capability artifacts
        run: |
          test -f /tmp/evermore-ai/src/generated/runtime.ts
          test -f /tmp/evermore-ai/src/generated/schemas.ts
          test -f /tmp/evermore-ai/src/generated/evermore.ai.json
          grep -q 'Human approval denied or missing' /tmp/evermore-ai/src/generated/runtime.ts
          grep -q 'exceeded token budget' /tmp/evermore-ai/src/generated/runtime.ts
          grep -q 'EvermoreModelProvider' /tmp/evermore-ai/src/generated/runtime.ts


      - name: Generate React Native application
        run: npm run evermore -- build examples/mobile.ever --target react-native --out /tmp/evermore-mobile-rn

      - name: Install React Native application
        working-directory: /tmp/evermore-mobile-rn
        run: npm install

      - name: Type-check React Native application
        working-directory: /tmp/evermore-mobile-rn
        run: npm run build

      - name: Verify native mobile boundaries
        run: |
          test -f /tmp/evermore-mobile-rn/ios/EvermoreNativeBridge.swift
          test -f /tmp/evermore-mobile-rn/android/EvermoreNativeBridge.kt
          grep -q 'EvermoreNativeStorage' /tmp/evermore-mobile-rn/src/generated/mobile-runtime.ts
          grep -q 'offline-first' /tmp/evermore-mobile-rn/src/generated/evermore.mobile.json

      - name: Generate Flutter experiment
        run: npm run evermore -- build examples/mobile.ever --target flutter --out /tmp/evermore-mobile-flutter

      - name: Verify Flutter experiment
        run: |
          test -f /tmp/evermore-mobile-flutter/pubspec.yaml
          test -f /tmp/evermore-mobile-flutter/lib/main.dart
          grep -q 'MaterialApp' /tmp/evermore-mobile-flutter/lib/main.dart
          grep -q 'flutter-experiment' /tmp/evermore-mobile-flutter/evermore.mobile.json


      - name: Generate Python data pipeline
        run: npm run evermore -- build examples/data-science.ever --target python --out /tmp/evermore-data

      - name: Compile generated Python modules
        run: python -m py_compile /tmp/evermore-data/run.py /tmp/evermore-data/evermore_generated/*.py

      - name: Verify M6 data artifacts
        run: |
          test -f /tmp/evermore-data/requirements.txt
          test -f /tmp/evermore-data/evermore_generated/contracts.py
          test -f /tmp/evermore-data/evermore_generated/datasets.py
          test -f /tmp/evermore-data/evermore_generated/arrays.py
          test -f /tmp/evermore-data/evermore_generated/bridges.py
          test -f /tmp/evermore-data/evermore_generated/tracking.py
          test -f /tmp/evermore-data/evermore_generated/pipelines.py
          grep -q 'pandas as pd' /tmp/evermore-data/evermore_generated/datasets.py
          grep -q 'numpy as np' /tmp/evermore-data/evermore_generated/arrays.py
          grep -q 'sha256' /tmp/evermore-data/evermore_generated/datasets.py
          grep -q 'random.seed(42)' /tmp/evermore-data/evermore_generated/pipelines.py
          grep -q 'deterministicSeeds' /tmp/evermore-data/evermore.data.json


      - name: Check infrastructure example
        run: npm run evermore -- check examples/infrastructure.ever

      - name: Generate infrastructure plan
        run: npm run evermore -- build examples/infrastructure.ever --target infra --out /tmp/evermore-infra

      - name: Verify M7 infrastructure artifacts
        run: |
          test -f /tmp/evermore-infra/evermore.plan.json
          test -f /tmp/evermore-infra/deploy/production/Dockerfile
          test -f /tmp/evermore-infra/deploy/production/kubernetes.yaml
          test -f /tmp/evermore-infra/deploy/production/plan.sh
          test -f /tmp/evermore-infra/deploy/production/apply.sh
          test -f /tmp/evermore-infra/deploy/production/rollback.sh
          grep -q 'mutationRequiresExplicitApply' /tmp/evermore-infra/evermore.plan.json
          grep -q 'secretKeyRef' /tmp/evermore-infra/deploy/production/kubernetes.yaml
          grep -q 'revisionHistoryLimit: 5' /tmp/evermore-infra/deploy/production/kubernetes.yaml
          grep -q 'EVERMORE_APPLY' /tmp/evermore-infra/deploy/production/apply.sh


      - name: Generate M8 documentation artifact
        run: npm run docs -- examples/showcase.ever /tmp/evermore-showcase.md

      - name: Verify M8 tooling artifacts
        run: |
          grep -q '# Evermore Showcase' /tmp/evermore-showcase.md
          test -f playground/index.html
          test -f studio/index.html
          test -f docs/PACKAGE_REGISTRY.md
          test -f src/tooling/lsp-server.ts
