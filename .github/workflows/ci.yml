name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: evermore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Reproduce M1 syntax study
        run: npm run research:m1

      - name: Build compiler
        run: npm run build

      - name: Check explicit example
        run: npm run evermore -- check examples/hello.ever

      - name: Check natural example
        run: npm run evermore -- check examples/natural.ever

      - name: Check reactive example
        run: npm run evermore -- check examples/counter.ever

      - name: Check layout example
        run: npm run evermore -- check examples/layout.ever

      - name: Check component example
        run: npm run evermore -- check examples/components.ever

      - name: Check M1 showcase
        run: npm run evermore -- check examples/showcase.ever

      - name: Check typed data example
        run: npm run evermore -- check examples/data.ever

      - name: Check typed function example
        run: npm run evermore -- check examples/functions.ever

      - name: Check choice example
        run: npm run evermore -- check examples/choices.ever

      - name: Check match example
        run: npm run evermore -- check examples/match.ever

      - name: Check inference example
        run: npm run evermore -- check examples/inference.ever

      - name: Check generics example
        run: npm run evermore -- check examples/generics.ever

      - name: Check protocol example
        run: npm run evermore -- check examples/protocols.ever

      - name: Check protocol values example
        run: npm run evermore -- check examples/protocol-values.ever

      - name: Check data constructor example
        run: npm run evermore -- check examples/constructors.ever

      - name: Check mutable values example
        run: npm run evermore -- check examples/mutable-values.ever

      - name: Check typed collections example
        run: npm run evermore -- check examples/collections.ever

      - name: Verify canonical formatter
        run: |
          npm run --silent evermore -- format examples/natural.ever > /tmp/natural.formatted.ever
          cmp examples/natural.ever /tmp/natural.formatted.ever

      - name: Generate Vue application
        run: npm run evermore -- build examples/natural.ever --out /tmp/evermore-example

      - name: Verify generated manifest
        run: test -f /tmp/evermore-example/src/generated/evermore.manifest.json

      - name: Install generated application
        working-directory: /tmp/evermore-example
        run: npm install

      - name: Build generated Vue application
        working-directory: /tmp/evermore-example
        run: npm run build

      - name: Generate reactive Vue application
        run: npm run evermore -- build examples/counter.ever --out /tmp/evermore-counter

      - name: Install reactive application
        working-directory: /tmp/evermore-counter
        run: npm install

      - name: Build reactive Vue application
        working-directory: /tmp/evermore-counter
        run: npm run build

      - name: Generate layout Vue application
        run: npm run evermore -- build examples/layout.ever --out /tmp/evermore-layout

      - name: Install layout application
        working-directory: /tmp/evermore-layout
        run: npm install

      - name: Build layout Vue application
        working-directory: /tmp/evermore-layout
        run: npm run build

      - name: Generate M1 showcase
        run: npm run evermore -- build examples/showcase.ever --out /tmp/evermore-showcase

      - name: Install M1 showcase
        working-directory: /tmp/evermore-showcase
        run: npm install

      - name: Build M1 showcase
        working-directory: /tmp/evermore-showcase
        run: npm run build

      - name: Generate typed data application
        run: npm run evermore -- build examples/data.ever --out /tmp/evermore-data

      - name: Install typed data application
        working-directory: /tmp/evermore-data
        run: npm install

      - name: Build typed data application
        working-directory: /tmp/evermore-data
        run: npm run build

      - name: Verify generated type model
        run: test -f /tmp/evermore-data/src/generated/models.ts

      - name: Generate typed function application
        run: npm run evermore -- build examples/functions.ever --out /tmp/evermore-functions

      - name: Install typed function application
        working-directory: /tmp/evermore-functions
        run: npm install

      - name: Build typed function application
        working-directory: /tmp/evermore-functions
        run: npm run build

      - name: Verify generated functions
        run: test -f /tmp/evermore-functions/src/generated/functions.ts

      - name: Generate choice application
        run: npm run evermore -- build examples/choices.ever --out /tmp/evermore-choices

      - name: Install choice application
        working-directory: /tmp/evermore-choices
        run: npm install

      - name: Build choice application
        working-directory: /tmp/evermore-choices
        run: npm run build

      - name: Verify generated choice model
        run: grep -q '"Status"' /tmp/evermore-choices/src/generated/models.ts

      - name: Generate match application
        run: npm run evermore -- build examples/match.ever --out /tmp/evermore-match

      - name: Install match application
        working-directory: /tmp/evermore-match
        run: npm install

      - name: Build match application
        working-directory: /tmp/evermore-match
        run: npm run build

      - name: Verify generated exhaustive match
        run: grep -q 'Unreachable Evermore match' /tmp/evermore-match/src/generated/functions.ts

      - name: Generate inference application
        run: npm run evermore -- build examples/inference.ever --out /tmp/evermore-inference

      - name: Install inference application
        working-directory: /tmp/evermore-inference
        run: npm install

      - name: Build inference application
        working-directory: /tmp/evermore-inference
        run: npm run build

      - name: Verify contextual empty-list generation
        run: grep -q 'return \[\];' /tmp/evermore-inference/src/generated/functions.ts

      - name: Generate generics application
        run: npm run evermore -- build examples/generics.ever --out /tmp/evermore-generics

      - name: Install generics application
        working-directory: /tmp/evermore-generics
        run: npm install

      - name: Build generics application
        working-directory: /tmp/evermore-generics
        run: npm run build

      - name: Verify generated generic functions
        run: grep -q 'function fn_0<T0>' /tmp/evermore-generics/src/generated/functions.ts

      - name: Generate protocol application
        run: npm run evermore -- build examples/protocols.ever --out /tmp/evermore-protocols

      - name: Install protocol application
        working-directory: /tmp/evermore-protocols
        run: npm install

      - name: Build protocol application
        working-directory: /tmp/evermore-protocols
        run: npm run build

      - name: Verify generated protocol contracts
        run: grep -q 'EvermoreProtocols' /tmp/evermore-protocols/src/generated/models.ts

      - name: Generate protocol values application
        run: npm run evermore -- build examples/protocol-values.ever --out /tmp/evermore-protocol-values

      - name: Install protocol values application
        working-directory: /tmp/evermore-protocol-values
        run: npm install

      - name: Build protocol values application
        working-directory: /tmp/evermore-protocol-values
        run: npm run build

      - name: Verify generated protocol member access
        run: grep -q 'EvermoreProtocols\["Named"\]' /tmp/evermore-protocol-values/src/generated/functions.ts

      - name: Generate data constructor application
        run: npm run evermore -- build examples/constructors.ever --out /tmp/evermore-constructors

      - name: Install data constructor application
        working-directory: /tmp/evermore-constructors
        run: npm install

      - name: Build data constructor application
        working-directory: /tmp/evermore-constructors
        run: npm run build

      - name: Verify generated data constructor
        run: |
          grep -q '"name": "Ada"' /tmp/evermore-constructors/src/generated/functions.ts

      - name: Generate mutable values application
        run: npm run evermore -- build examples/mutable-values.ever --out /tmp/evermore-mutable

      - name: Install mutable values application
        working-directory: /tmp/evermore-mutable
        run: npm install

      - name: Build mutable values application
        working-directory: /tmp/evermore-mutable
        run: npm run build

      - name: Verify generated mutable assignment
        run: |
          grep -q 'let local_0 = arg_0;' /tmp/evermore-mutable/src/generated/functions.ts

      - name: Generate typed collections application
        run: npm run evermore -- build examples/collections.ever --out /tmp/evermore-collections

      - name: Install typed collections application
        working-directory: /tmp/evermore-collections
        run: npm install

      - name: Build typed collections application
        working-directory: /tmp/evermore-collections
        run: npm run build

      - name: Verify generated collection families
        run: |
          grep -q 'ReadonlySet<string>' /tmp/evermore-collections/src/generated/functions.ts
          grep -q 'ReadonlyMap<string, number>' /tmp/evermore-collections/src/generated/functions.ts
          grep -q 'new Set' /tmp/evermore-collections/src/generated/functions.ts
          grep -q 'new Map' /tmp/evermore-collections/src/generated/functions.ts


